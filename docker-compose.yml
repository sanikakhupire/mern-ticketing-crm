services:
  mongodb:
    image: mongo:7-jammy
    container_name: mern_crm_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mern-crm

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mern_crm_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/mern-crm
      CLIENT_URL: http://localhost:80
      JWT_ACCESS_SECRET: dev_super_secret_jwt_access_key_12345
      JWT_REFRESH_SECRET: dev_super_secret_jwt_refresh_key_12345
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mern_crm_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
